version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: job-portal-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    container_name: job-portal-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/jobportal
      - JWT_SECRET=production_secret_key_change_me
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: job-portal-ui
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
